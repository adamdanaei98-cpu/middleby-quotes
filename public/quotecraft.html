/* ═══ PRICING ENGINE ═══ */
function gP(it,s){
  if(!s||!s.on)return 0;
  /* Determine base fixed price - from option or item default */
  var baseFP=(it.ops&&it.opP&&s.op&&it.opP[s.op]!=null)?it.opP[s.op]:(it.fp||0);
  /* Determine variable price per unit - from option or item default */
  var baseVP=(it.ops&&it.opVP&&s.op&&it.opVP[s.op]!=null)?it.opVP[s.op]:(it.vp||0);
  var q=(s.q||0)>0?s.q:1;
  /* Calculate: fixed + (variable * qty), or fixed * qty if no variable */
  var p=baseFP;
  if(baseVP>0){p=baseFP+baseVP*q;}
  else if(it.hq&&q>1){p=baseFP*q;}
  /* Add sub-option modifiers */
  if(it.subs&&s.subs)it.subs.forEach(function(sub){var ch=s.subs[sub.k];if(ch&&sub.mod&&sub.mod[ch])p+=sub.mod[ch];});
  return Math.round(p);
}
function cTot(cat,sel){const s={};let g=0;Object.entries(cat).forEach(([k,d])=>{let t=0;(d.items||[]).forEach(i=>{t+=gP(i,sel[i.id]);});s[k]=t;g+=t;});return{s,g};}
function itemDN(it,s){let dn=it.ops&&s.op?it.n+" ("+s.op+")":it.n;if(it.subs&&s.subs){const sp=it.subs.map(sub=>s.subs[sub.k]).filter(Boolean);if(sp.length)dn+=" ("+sp.join(", ")+")";}return dn;}
